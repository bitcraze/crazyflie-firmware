# Build fragment: TDoA3 + Lighthouse both feeding the estimator, for capturing
# the LH+TDoA -> TDoA-only handover. Unlike tdoa3_lh_groundtruth.conf there is
# no independent reference in the log; pair with config_tdoa_lh_transition.txt.
#
#   ./scripts/kconfig/merge_config.sh -m -O build build/.config \
#       tools/usdlog/tdoa3_lh_fusion.conf

CONFIG_DECK_LOCO=y
CONFIG_DECK_LOCO_ALGORITHM_TDOA3=y
# Lighthouse drives UART1; the Loco deck's default IRQ/RESET pins are RX1/TX1.
# Requires a Loco deck wired for IO_2/IO_3. See README_tdoa_candidates.md.
CONFIG_DECK_LOCODECK_USE_ALT_PINS=y

CONFIG_DECK_LIGHTHOUSE=y
# pulse_processor_v2.c:281 drops frames with channel >= this. Default is 4.
CONFIG_DECK_LIGHTHOUSE_MAX_N_BS=8
# CONFIG_DECK_LIGHTHOUSE_AS_GROUNDTRUTH deliberately not set: Lighthouse feeds
# the estimator (estimationMethod defaults to 1, sweep angles).

CONFIG_DECK_LOCO_TDOA3_LOG_CANDIDATES=y

CONFIG_DECK_USD=y
