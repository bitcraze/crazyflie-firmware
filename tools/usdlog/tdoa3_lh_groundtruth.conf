# Build config fragment for the rig this capture tooling was developed on:
# TDoA3 driving the estimator, with Lighthouse as an independent reference.
#
# The Lighthouse deck runs in "as groundtruth" mode, so it computes the
# crossing-beam position (logged as lighthouse.x/y/z) but does not feed it to
# the estimator. The estimate therefore stays TDoA-only and its errors
# reproduce, while Lighthouse gives a reference on the same clock to score them
# against. This is one setup that produces a replayable log, not the only one;
# see README_tdoa_candidates.md for what the replay actually needs.
#
# Merge it on top of a platform defconfig:
#   ./scripts/kconfig/merge_config.sh -m -O build build/.config \
#       tools/usdlog/tdoa3_lh_groundtruth.conf

CONFIG_DECK_LOCO=y
CONFIG_DECK_LOCO_ALGORITHM_TDOA3=y
# The Lighthouse deck drives UART1, and the Loco deck's default IRQ/RESET pins
# are RX1/TX1. Stacking both without this option makes the LPS task spin on
# phantom IRQs (UART traffic) as soon as the Lighthouse FPGA boots, starving the
# system until the watchdog resets it. Requires a Loco deck wired for IO_2/IO_3.
CONFIG_DECK_LOCODECK_USE_ALT_PINS=y

CONFIG_DECK_LIGHTHOUSE=y
CONFIG_DECK_LIGHTHOUSE_AS_GROUNDTRUTH=y

# Start with candidate logging already on, so that a capture needs no radio
# link to arm it: tdoaEngine.logCand is not persistent and would otherwise have
# to be set over a link after every boot. Pair this with "enable logging on
# startup" (line 4 of config.txt) for a fully link-free capture.
CONFIG_DECK_LOCO_TDOA3_LOG_CANDIDATES=y

CONFIG_DECK_USD=y
