# Config fragment for TDoA3 fly-away debugging with Lighthouse ground truth.
#
# - Loco deck in TDoA3 mode drives the Kalman estimator.
# - Lighthouse deck runs in "as groundtruth" mode: it computes the crossing-beam
#   position (logged as lighthouse.x/y/z) but does NOT feed it to the estimator,
#   so the estimator runs on TDoA only and fly-aways are reproduced while the
#   Lighthouse position provides an independent ground-truth reference.
# - uSD deck logs the candidate TDoA data (see tools/usdlog/config_tdoa_candidates.txt).
#
# Build (merges on top of the platform defconfig). Note that this kbuild setup
# keeps the generated .config in the build/ output directory:
#   make cf2_defconfig
#   ./scripts/kconfig/merge_config.sh -m -O build build/.config configs/tdoa3_lh_groundtruth.conf
#   make olddefconfig
#   make -j$(nproc)
# The firmware to flash is build/cf2.bin

CONFIG_DECK_LOCO=y
CONFIG_DECK_LOCO_ALGORITHM_TDOA3=y

CONFIG_DECK_LIGHTHOUSE=y
CONFIG_DECK_LIGHTHOUSE_AS_GROUNDTRUTH=y

CONFIG_DECK_USD=y
